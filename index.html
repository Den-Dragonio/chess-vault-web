<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Vault</title>
    <link rel="icon" href="img/icon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="img/icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="book-modal.css">
    <link rel="stylesheet" href="champions.css">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="dark-mode-init.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <div id="toast-container"></div>

    <header class="main-header">
        <nav class="nav-menu">
            <button class="hamburger" onclick="this.closest('nav').classList.toggle('open')">☰</button>
            <a href="index.html">Головна</a>
            <a href="profile.html" id="nav-my-account" style="display:none;">Мій Аккаунт</a>
            <a href="library.html">Бібліотека</a>
            <div class="dropdown">
                <a class="dropbtn" id="acc-btn">Аккаунт ▾</a>
                <div class="dropdown-content" id="acc-dropdown">
                    <a href="#" id="login-trigger">🔑 Вхід</a>
                    <a href="#" id="reg-trigger">📝 Реєстрація</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-container">
        <div class="news-block">
            <div class="news-section">
                <h2>Новини</h2>
                <div class="news-list" id="news-list-dynamic">
                    <!-- Завантажується з Firestore -->
                </div>
            </div>
        </div>
        <div class="main-sidebar">
            <div class="top-books">
                <h3>Топ завантажень</h3>
                <ol id="top-books-list">
                    <li>Поки порожньо...</li>
                    <li>-</li>
                    <li>-</li>
                    <li>-</li>
                    <li>-</li>
                </ol>
            </div>
            <div class="useful-links">
                <h3>Корисні посилання</h3>
                <ul class="useful-links-list">
                    <li><a href="https://www.chess.com" target="_blank" rel="noopener">♟️ Chess.com</a></li>
                    <li><a href="https://lichess.org" target="_blank" rel="noopener">♞ Lichess</a></li>
                    <li><a href="https://stepchess.ru" target="_blank" rel="noopener">📚 StepChess</a></li>
                </ul>
            </div>
        </div>
    </main>

    <!-- ============================================
         СЕКЦІЯ ЧЕМПІОНІВ СВІТУ (Тільки заголовок)
         ============================================ -->
    <section class="champions-section" id="champions">
        <div class="champions-header">
            <h2 class="champions-title">Чемпіони світу</h2>
        </div>
        <div class="champions-list" id="champions-list">
            <!-- 1 рядок на 1 людину, квадратні рамки фото -->
        </div>
    </section>

    <!-- ============================================
         МОДАЛЬНЕ ВІКНО ЧЕМПІОНА (1 в 1 як для книги)
         ============================================ -->
    <div id="champion-modal-overlay">
        <div id="champion-modal-card">
            <button id="champion-modal-close">✕</button>
            <div id="champion-modal-body">
                <!-- Динамічний вміст з champions.js -->
            </div>
        </div>
    </div>

    <!-- BOOK DETAIL MODAL (для відкриття конкретної книги) -->
    <div id="book-detail-overlay">
        <div id="book-detail-card">
            <button id="book-detail-close">✕</button>
        </div>
    </div>

    <!-- Модалка: Вхід -->
    <div class="modal-overlay" id="login-modal">
        <div class="login-card">
            <button class="modal-close" id="close-login">✕</button>
            <h1>Вхід</h1>
            <form id="auth-form" class="modal-form">
                <input type="text" id="login-username" placeholder="Логін" required autocomplete="username">
                <input type="password" id="login-password" placeholder="Пароль" required
                    autocomplete="current-password">
                <button type="submit" class="login-btn">Увійти</button>
            </form>
            <p id="auth-error" class="auth-error"></p>
            <p class="switch-text">Немає аккаунту? <a href="#" id="switch-to-reg">Реєстрація</a></p>
        </div>
    </div>

    <!-- Модалка: Реєстрація -->
    <div class="modal-overlay" id="reg-modal">
        <div class="login-card">
            <button class="modal-close" id="close-reg">✕</button>
            <h1>Реєстрація</h1>
            <form id="signup-form" class="modal-form">
                <input type="text" id="reg-name" placeholder="Придумай логін" required autocomplete="username">
                <input type="password" id="reg-password" placeholder="Придумай пароль (мін. 6 символів)" required
                    autocomplete="new-password">
                <button type="submit" class="login-btn">Створити аккаунт</button>
            </form>
            <p id="reg-error" class="auth-error"></p>
            <p class="switch-text">Вже є аккаунт? <a href="#" id="switch-to-login">Увійти</a></p>
        </div>
    </div>

    <div id="bg-grid-container"></div>
    <div id="giant-left" class="giant-container left"></div>
    <div id="giant-right" class="giant-container right"></div>

    <!-- Плаваюча кнопка «Нагору» -->
    <button id="scroll-to-top" class="scroll-to-top" title="Нагору" aria-label="Нагору">
        <span class="scroll-arrow">↑</span>
    </button>

    <script src="page_counts.js"></script>
    <script src="descriptions.js"></script>
    <script src="book-modal.js"></script>
    <script src="champions-data.js"></script>
    <script src="champions.js"></script>
    <script src="script.js"></script>
</body>

</html>
